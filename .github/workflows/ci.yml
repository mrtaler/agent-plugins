name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Parse JSON files
        run: |
          for json_file in .claude-plugin/marketplace.json .agents/plugins/marketplace.json .releaserc.json; do
            python3 -m json.tool "$json_file" > /dev/null
            echo "ok: $json_file"
          done

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.321

      - name: Check catalog entries and shared source revisions
        run: node scripts/validate-catalogs.cjs

      - name: Test the catalog validator
        run: node --test scripts/*.spec.cjs

      # An empty catalog always carries the warning "Marketplace has no plugins defined",
      # so --strict is applied once the Claude catalog lists at least one plugin.
      - name: Validate the Claude Code catalog
        run: |
          if python3 -c 'import json, sys; sys.exit(0 if json.load(open(".claude-plugin/marketplace.json"))["plugins"] else 1)'; then
            claude plugin validate --strict .
          else
            claude plugin validate .
          fi
